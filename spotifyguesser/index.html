<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotify Playlist Guesser</title>
  <style>
    :root {
      --bg: #121212;
      --card: #181818;
      --accent: #1db954;
      --accent-hover: #1ed760;
      --text: #ffffff;
      --text-muted: #b3b3b3;
      --border: #282828;
      --miss: #e91429;
      --skip: #535353;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; justify-content: center; min-height: 100vh; padding: 20px 16px; }
    .container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 14px; }
    
    header { text-align: center; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
    header h1 { font-size: 1.5rem; font-weight: 800; color: var(--accent); letter-spacing: 0.5px; }

    .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
    input, button { border-radius: 8px; border: 1px solid var(--border); background: #222; color: var(--text); font-size: 0.9rem; padding: 10px 12px; }
    input:focus { outline: 2px solid var(--accent); }
    button { cursor: pointer; font-weight: 600; }
    .btn-green { background: var(--accent); color: black; border: none; }
    .btn-green:hover { background: var(--accent-hover); }

    .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; text-align: center; gap: 6px; font-size: 0.8rem; }
    .stat-val { font-size: 1.1rem; font-weight: bold; color: var(--accent); }
    .stat-val.fail { color: var(--miss); }

    .progress-bar-bg { width: 100%; height: 6px; background: #282828; border-radius: 3px; overflow: hidden; display: none; }
    .progress-bar-fill { height: 100%; width: 0%; background: var(--accent); transition: width 0.15s ease; }

    .timeline { display: grid; grid-template-columns: 1fr 1fr 2fr 3fr 4fr 5fr; gap: 4px; height: 14px; margin: 4px 0; }
    .segment { background: var(--card); border: 1px solid var(--border); border-radius: 3px; }
    .segment.unlocked { background: #383838; }
    .segment.correct { background: var(--accent); }
    .segment.wrong { background: var(--miss); }
    .segment.skipped { background: var(--skip); }

    .player-controls { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .play-btn { width: 56px; height: 56px; border-radius: 50%; background: var(--accent); border: none; color: black; font-size: 1.4rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .play-btn:disabled { background: #333; color: #666; cursor: not-allowed; }

    .guesses-list { display: flex; flex-direction: column; gap: 6px; }
    .guess-row { height: 36px; border: 1px solid var(--border); border-radius: 6px; display: flex; align-items: center; padding: 0 12px; font-size: 0.85rem; color: var(--text-muted); background: var(--card); }
    .guess-row.filled { color: var(--text); }
    .guess-row.correct { border-color: var(--accent); color: var(--accent); font-weight: bold; }
    .guess-row.wrong { border-color: var(--miss); color: var(--miss); }

    .autocomplete-wrap { position: relative; }
    .suggestions { position: absolute; bottom: 100%; left: 0; right: 0; background: #242424; border: 1px solid var(--border); border-radius: 8px; max-height: 170px; overflow-y: auto; z-index: 20; display: none; }
    .suggestion-item { padding: 9px 12px; cursor: pointer; border-bottom: 1px solid #333; font-size: 0.85rem; }
    .suggestion-item:hover { background: #333; }

    .actions { display: flex; gap: 8px; }
    .actions button { flex: 1; }

    .result-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 16px; text-align: center; display: none; }
    .result-card img { width: 110px; height: 110px; border-radius: 6px; margin: 0 auto 8px auto; display: block; }
    #statusMsg { font-size: 0.8rem; color: var(--text-muted); text-align: center; min-height: 18px; }
  </style>
</head>
<body>
<div class="container">
  <header><h1>SPOTIFY GUESSER</h1></header>

  <!-- Step 1: Client ID Auth -->
  <div class="card" id="authPanel">
    <label style="font-size: 0.85rem; font-weight: bold;">Spotify Client ID:</label>
    <input type="text" id="clientIdInput" placeholder="Paste your Client ID from Spotify Dashboard">
    <button class="btn-green" id="loginBtn">Connect Spotify Account</button>
  </div>

  <!-- Step 2: Playlist Loader -->
  <div class="card" id="playlistPanel" style="display: none;">
    <div style="display: flex; gap: 6px;">
      <input type="text" id="playlistUrl" placeholder="Paste Spotify Playlist URL / URI" style="flex: 1;">
      <button class="btn-green" id="loadBtn">Load</button>
    </div>
    <div class="progress-bar-bg" id="progWrap"><div class="progress-bar-fill" id="progFill"></div></div>
    
    <div class="stats-grid">
      <div><div>Playlist Tracks</div><span class="stat-val" id="statTotal">0</span></div>
      <div><div>Playable</div><span class="stat-val" id="statPlayable">0</span></div>
      <div><div>Missing Preview</div><span class="stat-val fail" id="statMissing">0</span></div>
    </div>
  </div>

  <!-- Step 3: Game Player -->
  <div class="timeline" id="timeline">
    <div class="segment unlocked"></div><div class="segment"></div><div class="segment"></div><div class="segment"></div><div class="segment"></div><div class="segment"></div>
  </div>

  <div class="player-controls">
    <button class="play-btn" id="playBtn" disabled>▶</button>
    <span id="timeDisplay" style="font-size: 0.85rem; color: var(--text-muted);">0.0s / 1.0s</span>
    <span id="statusMsg">Enter your Client ID above to start</span>
  </div>

  <div class="guesses-list">
    <div class="guess-row">1. Empty</div><div class="guess-row">2. Empty</div><div class="guess-row">3. Empty</div>
    <div class="guess-row">4. Empty</div><div class="guess-row">5. Empty</div><div class="guess-row">6. Empty</div>
  </div>

  <div class="result-card" id="resultCard">
    <img id="resCover" src="" alt="Album Artwork">
    <h3 id="resTitle" style="font-size: 1rem;"></h3>
    <p id="resArtist" style="color: var(--text-muted); font-size: 0.85rem;"></p>
    <button class="btn-green" id="nextBtn" style="margin-top: 12px; width: 100%;">Next Song</button>
  </div>

  <div class="autocomplete-wrap" id="controlsWrap">
    <div class="suggestions" id="suggestions"></div>
    <input type="text" id="guessInput" placeholder="Guess track title or artist..." style="width: 100%;">
  </div>

  <div class="actions" id="actionButtons">
    <button id="skipBtn">Skip (+1s)</button>
    <button class="btn-green" id="submitBtn">Submit</button>
  </div>
</div>

<audio id="audioPlayer" preload="auto" playsinline></audio>

<script>
  const DURS = [1, 2, 4, 7, 11, 16];
  let currentStep = 0, targetTrack = null, isPlaying = false;
  let rawPlaylistTracks = [], playablePool = [], accessToken = null;

  const audio = document.getElementById('audioPlayer');
  const playBtn = document.getElementById('playBtn');
  const timeDisplay = document.getElementById('timeDisplay');
  const statusMsg = document.getElementById('statusMsg');
  const guessInput = document.getElementById('guessInput');
  const suggestions = document.getElementById('suggestions');
  const resultCard = document.getElementById('resultCard');

  // --- Spotify PKCE OAuth Helpers ---
  function generateRandomString(length) {
    const possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
    const values = crypto.getRandomValues(new Uint8Array(length));
    return values.reduce((acc, x) => acc + possible[x % possible.length], "");
  }

  async function generateCodeChallenge(codeVerifier) {
    const data = new TextEncoder().encode(codeVerifier);
    const digest = await window.crypto.subtle.digest('SHA-256', data);
    return btoa(String.fromCharCode.apply(null, [...new Uint8Array(digest)]))
      .replace(/\+/g, '-')
      .replace(/\//g, '_')
      .replace(/=+$/, '');
  }

  function getRedirectUri() {
    return window.location.origin + window.location.pathname;
  }

  async function startAuth() {
    const clientId = document.getElementById('clientIdInput').value.trim();
    if (!clientId) { alert('Please enter your Spotify Client ID'); return; }
    localStorage.setItem('spotify_client_id', clientId);

    const verifier = generateRandomString(128);
    const challenge = await generateCodeChallenge(verifier);
    localStorage.setItem('spotify_verifier', verifier);

    const redirectUri = getRedirectUri();
    const scope = 'playlist-read-private playlist-read-collaborative';
    const authUrl = `https://accounts.spotify.com/authorize?client_id=${encodeURIComponent(clientId)}&response_type=code&redirect_uri=${encodeURIComponent(redirectUri)}&scope=${encodeURIComponent(scope)}&code_challenge_method=S256&code_challenge=${encodeURIComponent(challenge)}`;
    
    window.location.href = authUrl;
  }

  async function handleAuthCallback() {
    const urlParams = new URLSearchParams(window.location.search);
    const code = urlParams.get('code');
    const clientId = localStorage.getItem('spotify_client_id');
    const verifier = localStorage.getItem('spotify_verifier');

    if (code && clientId && verifier) {
      window.history.replaceState({}, document.title, window.location.pathname);
      statusMsg.textContent = 'Authenticating with Spotify...';

      try {
        const res = await fetch('https://accounts.spotify.com/api/token', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({
            client_id: clientId,
            grant_type: 'authorization_code',
            code: code,
            redirect_uri: getRedirectUri(),
            code_verifier: verifier
          })
        });

        const data = await res.json();
        if (data.access_token) {
          accessToken = data.access_token;
          sessionStorage.setItem('spotify_token', accessToken);
        }
      } catch (err) {
        statusMsg.textContent = 'Authentication error. Please retry.';
      }
    } else {
      accessToken = sessionStorage.getItem('spotify_token');
    }

    if (accessToken) {
      document.getElementById('authPanel').style.display = 'none';
      document.getElementById('playlistPanel').style.display = 'flex';
      statusMsg.textContent = 'Connected to Spotify! Paste a playlist link above.';
    }
  }

  // --- Spotify Playlist Pagination ---
  async function fetchAllPlaylistTracks(playlistId) {
    let tracks = [];
    let url = `https://api.spotify.com/v1/playlists/${playlistId}/tracks?limit=50`;

    while (url) {
      const res = await fetch(url, { headers: { 'Authorization': `Bearer ${accessToken}` } });
      if (!res.ok) throw new Error('Spotify API Error');
      const data = await res.json();
      
      data.items.forEach(item => {
        if (item.track && item.track.name) {
          tracks.push({
            title: item.track.name,
            artist: item.track.artists.map(a => a.name).join(', '),
            cover: item.track.album?.images?.[0]?.url || ''
          });
        }
      });
      url = data.next;
    }
    return tracks;
  }

  function cleanTitle(str) {
    return str.replace(/\s*-\s*(Remastered|Radio Edit|Remaster|Bonus Track).*/i, '')
              .replace(/\(feat\..*?\)/i, '')
              .replace(/\(.*?\)/g, '')
              .trim();
  }

  async function resolvePreview(track) {
    try {
      const clean = cleanTitle(track.title);
      const query = `${track.artist} ${clean}`;
      const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&entity=song&limit=1`);
      const data = await res.json();
      if (data.results && data.results[0]?.previewUrl) {
        return {
          title: track.title,
          artist: track.artist,
          cover: track.cover || data.results[0].artworkUrl100,
          previewUrl: data.results[0].previewUrl
        };
      }
    } catch (e) {}
    return null;
  }

  async function loadPlaylist() {
    const val = document.getElementById('playlistUrl').value.trim();
    const idMatch = val.match(/playlist[\/:]([a-zA-Z0-9]+)/) || val.match(/^([a-zA-Z0-9]{22})$/);
    if (!idMatch) { statusMsg.textContent = 'Invalid Spotify playlist link.'; return; }

    const playlistId = idMatch[1];
    statusMsg.textContent = 'Fetching playlist metadata...';
    document.getElementById('progWrap').style.display = 'block';
    playBtn.disabled = true;

    try {
      rawPlaylistTracks = await fetchAllPlaylistTracks(playlistId);
      document.getElementById('statTotal').textContent = rawPlaylistTracks.length;
      document.getElementById('statPlayable').textContent = '0';
      document.getElementById('statMissing').textContent = '0';

      playablePool = [];
      let missingCount = 0;

      for (let i = 0; i < rawPlaylistTracks.length; i += 5) {
        const batch = rawPlaylistTracks.slice(i, i + 5);
        const resolved = await Promise.all(batch.map(resolvePreview));

        resolved.forEach(r => {
          if (r) playablePool.push(r);
          else missingCount++;
        });

        document.getElementById('statPlayable').textContent = playablePool.length;
        document.getElementById('statMissing').textContent = missingCount;
        const pct = Math.round(((i + batch.length) / rawPlaylistTracks.length) * 100);
        document.getElementById('progFill').style.width = pct + '%';
        statusMsg.textContent = `Scanning audio: ${i + batch.length}/${rawPlaylistTracks.length}...`;

        if (playablePool.length >= 2 && playBtn.disabled) startRound();
      }

      statusMsg.textContent = `Ready! ${playablePool.length} playable songs.`;
    } catch (err) {
      statusMsg.textContent = 'Error reading playlist. Check link and permissions.';
    }
  }

  // --- Game Engine ---
  function startRound() {
    if (!playablePool.length) return;
    resultCard.style.display = 'none';
    document.getElementById('controlsWrap').style.display = 'block';
    document.getElementById('actionButtons').style.display = 'flex';
    currentStep = 0;
    stopAudio();

    targetTrack = playablePool[Math.floor(Math.random() * playablePool.length)];
    audio.src = targetTrack.previewUrl;
    audio.load();

    document.querySelectorAll('.guess-row').forEach((r, i) => {
      r.className = 'guess-row';
      r.textContent = `${i + 1}. Empty`;
    });
    updateTimeline();
    playBtn.disabled = false;
  }

  function updateTimeline() {
    document.querySelectorAll('.segment').forEach((seg, i) => {
      seg.className = 'segment';
      if (i <= currentStep) seg.classList.add('unlocked');
    });
    timeDisplay.textContent = `0.0s / ${DURS[currentStep]}.0s`;
  }

  function stopAudio() {
    audio.pause();
    audio.currentTime = 0;
    isPlaying = false;
    playBtn.textContent = '▶';
    timeDisplay.textContent = `0.0s / ${DURS[currentStep]}.0s`;
  }

  playBtn.addEventListener('click', () => {
    if (isPlaying) stopAudio();
    else {
      audio.currentTime = 0;
      audio.play().then(() => { isPlaying = true; playBtn.textContent = '❚❚'; }).catch(() => {});
    }
  });

  audio.addEventListener('timeupdate', () => {
    if (!isPlaying) return;
    const max = DURS[currentStep];
    timeDisplay.textContent = `${audio.currentTime.toFixed(1)}s / ${max}.0s`;
    if (audio.currentTime >= max) stopAudio();
  });

  function advanceStep(status, text) {
    const rows = document.querySelectorAll('.guess-row');
    const segs = document.querySelectorAll('.segment');
    rows[currentStep].classList.add('filled', status);
    rows[currentStep].textContent = `${currentStep + 1}. ${text}`;
    segs[currentStep].className = `segment ${status}`;
    stopAudio();

    if (status === 'correct' || currentStep === 5) {
      document.getElementById('controlsWrap').style.display = 'none';
      document.getElementById('actionButtons').style.display = 'none';
      resultCard.style.display = 'block';
      document.getElementById('resCover').src = targetTrack.cover;
      document.getElementById('resTitle').textContent = `${status === 'correct' ? '🎉' : '❌'} ${targetTrack.title}`;
      document.getElementById('resArtist').textContent = targetTrack.artist;
      return;
    }
    currentStep++;
    updateTimeline();
    const nextGap = DURS[currentStep] - DURS[currentStep - 1];
    document.getElementById('skipBtn').textContent = currentStep === 5 ? 'Give Up' : `Skip (+${nextGap}s)`;
  }

  guessInput.addEventListener('input', () => {
    const val = guessInput.value.toLowerCase().trim();
    if (!val) { suggestions.style.display = 'none'; return; }
    const matches = rawPlaylistTracks.filter(t => (t.title + ' ' + t.artist).toLowerCase().includes(val)).slice(0, 5);
    suggestions.innerHTML = '';
    matches.forEach(t => {
      const d = document.createElement('div');
      d.className = 'suggestion-item';
      d.textContent = `${t.artist} - ${t.title}`;
      d.onclick = () => {
        guessInput.value = `${t.artist} - ${t.title}`;
        guessInput.dataset.title = t.title;
        suggestions.style.display = 'none';
      };
      suggestions.appendChild(d);
    });
    suggestions.style.display = matches.length ? 'block' : 'none';
  });

  document.getElementById('submitBtn').addEventListener('click', () => {
    const guessVal = (guessInput.dataset.title || guessInput.value).toLowerCase();
    if (!guessVal) return;
    const cleanTarget = cleanTitle(targetTrack.title).toLowerCase();
    const isCorrect = guessVal.includes(cleanTarget) || cleanTarget.includes(guessVal);
    advanceStep(isCorrect ? 'correct' : 'wrong', guessInput.value || 'Incorrect');
    guessInput.value = '';
    delete guessInput.dataset.title;
  });

  document.getElementById('skipBtn').addEventListener('click', () => advanceStep('skipped', 'Skipped'));
  document.getElementById('loginBtn').addEventListener('click', startAuth);
  document.getElementById('loadBtn').addEventListener('click', loadPlaylist);
  document.getElementById('nextBtn').addEventListener('click', startRound);

  // Restore saved Client ID if already entered previously
  const savedId = localStorage.getItem('spotify_client_id');
  if (savedId) document.getElementById('clientIdInput').value = savedId;
  handleAuthCallback();
</script>
</body>
</html>
